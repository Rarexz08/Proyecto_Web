<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Entrega — RevistaExpress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-texto: #1c1c1c;
            --color-texto-secundario: #525252;
            --color-borde: #ddd8cf;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--color-texto);
            line-height: 1.5;
            background-color: #f5f3ef; /* Solo para pantalla */
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .recibo-contenedor {
            background-color: #fff;
            width: 100%;
            max-width: 800px;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--color-texto);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .marca {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
            color: #c0392b; /* Primario del sistema */
        }

        .titulo-doc {
            text-align: right;
        }

        .titulo-doc h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .titulo-doc p {
            margin: 0;
            color: var(--color-texto-secundario);
            font-family: monospace;
            font-size: 1.1rem;
        }

        .seccion {
            margin-bottom: 2rem;
        }

        .seccion-titulo {
            font-size: 1.1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--color-borde);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .fila-datos {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .grupo-dato {
            flex: 1;
            min-width: 200px;
        }

        .etiqueta {
            font-size: 0.85rem;
            color: var(--color-texto-secundario);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }

        .valor {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .tabla-articulos {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .tabla-articulos th {
            text-align: left;
            border-bottom: 2px solid var(--color-texto);
            padding: 0.8rem 0;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .tabla-articulos td {
            padding: 1rem 0;
            border-bottom: 1px solid var(--color-borde);
            font-size: 1.1rem;
        }

        .tabla-articulos .precio {
            text-align: right;
        }

        .firmas {
            display: flex;
            justify-content: space-between;
            margin-top: 5rem;
        }

        .caja-firma {
            width: 45%;
            text-align: center;
        }

        .linea-firma {
            border-top: 1px solid var(--color-texto);
            padding-top: 0.5rem;
            margin-top: 4rem;
        }
        
        .caja-firma p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--color-texto-secundario);
        }

        .footer-recibo {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--color-texto-secundario);
            border-top: 1px solid var(--color-borde);
            padding-top: 1rem;
        }

        .estado-entregado {
            display: inline-block;
            background-color: #ecfdf5;
            color: #047857;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-weight: 700;
            border: 1px solid #10b981;
            margin-bottom: 1.5rem;
        }

        .alerta-error {
            color: #b91c1c;
            text-align: center;
            font-weight: bold;
        }

        /* Estilos de Impresión */
        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .recibo-contenedor {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .boton-imprimir {
                display: none;
            }
        }

        .boton-imprimir {
            display: block;
            margin: 0 auto 2rem auto;
            padding: 0.8rem 2rem;
            background-color: #1c1c1c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        .boton-imprimir:hover {
            background-color: #000;
        }
    </style>
</head>
<body>

    <div class="recibo-contenedor" id="recibo-contenedor">
        <div id="cargando" style="text-align: center; font-size: 1.2rem; padding: 2rem;">Cargando comprobante...</div>
    </div>

    <script src="../js/comprobante.js"></script>
</body>
</html>
