<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciar sesión — Sistema de envío de revistas a domicilio RevistaExpress.">
    <title>Iniciar Sesión — RevistaExpress</title>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="pagina-login">

    <main class="contenedor-login" id="formulario-contenedor">

        <!-- Cabecera con marca -->
        <div class="login-cabecera">
            <div class="login-marca">
                <span class="login-icono-marca">📬</span>
                <span class="login-nombre-marca">RevistaExpress</span>
            </div>
            <h1 class="login-titulo">Bienvenido de nuevo</h1>
            <p class="login-subtitulo">Ingresa tus credenciales para acceder al panel de despachos.</p>
        </div>

        <!-- Mensaje de error (oculto por defecto) -->
        <div class="login-mensaje-error" id="mensaje-error">
            <span class="login-error-icono">⚠️</span>
            <span class="login-error-texto" id="texto-error"></span>
        </div>

        <!-- Formulario -->
        <form class="login-formulario" id="formulario-login" autocomplete="on">

            <!-- Campo: Correo electrónico -->
            <div class="login-grupo-campo">
                <label class="login-etiqueta" for="campo-email">Correo electrónico</label>
                <div class="login-campo-contenedor">
                    <span class="login-campo-icono">✉️</span>
                    <input
                        type="email"
                        class="login-campo"
                        id="campo-email"
                        name="email"
                        placeholder="admin@revistaexpress.com"
                        autocomplete="email"
                        required>
                </div>
            </div>

            <!-- Campo: Contraseña -->
            <div class="login-grupo-campo">
                <label class="login-etiqueta" for="campo-clave">Contraseña</label>
                <div class="login-campo-contenedor">
                    <span class="login-campo-icono">🔒</span>
                    <input
                        type="password"
                        class="login-campo"
                        id="campo-clave"
                        name="clave"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required>
                    <button type="button" class="login-toggle-clave" id="toggle-clave" title="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- Botón de ingreso -->
            <button type="submit" class="login-boton-entrar" id="boton-entrar">
                Ingresar al sistema
            </button>
        </form>

        <!-- Pie de la tarjeta -->
        <div class="login-pie">
            <p class="login-pie-texto">Sistema de gestión de envíos de revistas a domicilio</p>
        </div>

    </main>

    <!-- Scripts -->
    <script src="../js/login.js"></script>

</body>
</html>
